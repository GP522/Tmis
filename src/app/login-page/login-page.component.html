<div class="loginwraper">
    <div class="logincard">
        <form [formGroup]="form" (ngSubmit)="submitForm()">
            <div class="form-group">
                <label class="form-label">User Name :</label>
                <input formControlName="userName" type="text" name="" class="form-control" placeholder="Type User Name">
                <span  *ngIf="this.form.get('userName')?.touched && this.form.get('userName')?.invalid" id="" title="" style="color:Red;">User Name is required.</span>
            </div>
            <div class="form-group">
                <label class="form-label">Password :</label>
                <input formControlName="password" type="text" name="" class="form-control" placeholder="Type User Password">

                <span  *ngIf="this.form.get('password')?.touched && this.form.get('password')?.invalid"  id="ContentPlaceHolder1_rfvPassword" title="Password is required."
                    style="color:Red;">Password is required.</span>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="logincaptchainput">
                        <label class="form-label">&nbsp;</label>
                        <input formControlName="captcha"  type="text" name="" class="form-control" placeholder="Enter captcha shown">
                        <span  *ngIf="this.form.get('captcha')?.touched && this.form.get('captcha')?.invalid"  id="ContentPlaceHolder1_rfvCaptcha" title="Captcha Code is required."
                            style="color:Red;">Captcha is required.</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- captcha.component.html -->
                    <div class="logincaptcha">
                        <label class="form-label">Captcha :</label>
                        <div class="captcha-refresh">
                            <p>{{captchaUrl}}</p>
                            <button type="button" class="login1000-form-btn" (click)="generateCaptcha()"><img
                                    src="/assets/img/captcha-refresh.png" width="20" height="18" /></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label></label>
                        <input type="submit" class="form-control" class="login100-form-btn" />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group text-left">
                        <label></label>
                        <a id="lnkChangePassword" href="ForgotPassword.html" target="_blank" class="lgforgot">Forgot
                            Password?</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
