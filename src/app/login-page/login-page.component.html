<div class="loginwraper">
    <div class="logincard">
        <form action="">
            <div class="form-group">
                <label class="form-label">User Name :</label>
                <input type="text" name="" class="form-control" placeholder="Type User Name">
                <span id="" title="" style="color:Red;visibility:hidden;">User Name is required.</span>
            </div>
            <div class="form-group">
                <label class="form-label">Password :</label>
                <input type="text" name="" class="form-control" placeholder="Type User Password">

                <span id="ContentPlaceHolder1_rfvPassword" title="Password is required."
                    style="color:Red;visibility:hidden;">Password is required.</span>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="logincaptchainput">
                        <label class="form-label">&nbsp;</label>
                        <input type="text" name="" class="form-control" placeholder="Enter captcha shown">
                        <span id="ContentPlaceHolder1_rfvCaptcha" title="Captcha Code is required."
                            style="color:Red;visibility:hidden;">Captcha is required.</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- captcha.component.html -->
                    <div class="logincaptcha">
                        <label class="form-label">Captcha :</label>
                        <div class="captcha-refresh">
                            <p>{{captchaUrl}}</p>

                            <button type="button" class="login1000-form-btn" (click)="generateCaptcha()"><img
                                    src="/assets/img/captcha-refresh.png" width="20" height="20" /></button>
                        </div>
                    </div>

                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label></label>
                        <input type="submit" class="form-control" class="login100-form-btn" />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group text-left">
                        <label></label>
                        <a id="lnkChangePassword" href="ForgotPassword.html" target="_blank" class="lgforgot">Forgot
                            Password?</a>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>
